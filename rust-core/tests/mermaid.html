<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #F4F4F4;
        margin: 0;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
    .mermaid {
        color: #333333;
    }
</style>
</head>
<body>
<div class="mermaid">
      gantt
      title 项目进度
      dateFormat  YYYY-MM-DD
      section 阶段1
      任务1           :a1, 2024-01-01, 30d
      任务2           :a2, 2024-01-15, 20d
      section 阶段2
      任务3           :a3, 2024-02-01, 30d
</div>
<script>
    // 尝试加载本地 Mermaid.js
    (function() {
        var script = document.createElement('script');
        script.src = 'app-resource://mermaid/mermaid.min.js';
        script.onload = function() {
            console.log('Loaded Mermaid from local bundle');
            initMermaid();
        };
        script.onerror = function() {
            console.log('Failed to load Mermaid from local, falling back to CDN');
            // 降级到 CDN
            var cdnScript = document.createElement('script');
            cdnScript.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js';
            cdnScript.onload = function() {
                console.log('Loaded Mermaid from CDN');
                initMermaid();
            };
            cdnScript.onerror = function() {
                console.error('Failed to load Mermaid from both local and CDN');
            };
            document.head.appendChild(cdnScript);
        };
        document.head.appendChild(script);
    })();
</script>
<script>
    // 初始化 Mermaid
    function initMermaid() {
        if (typeof mermaid !== 'undefined') {
            console.log('Initializing Mermaid...');
            mermaid.initialize({ 
                startOnLoad: true,
                theme: 'default',
                themeVariables: {
                    primaryColor: '#333333',
                    primaryTextColor: '#333333',
                    primaryBorderColor: '#333333',
                    lineColor: '#333333',
                    secondaryColor: '#F4F4F4',
                    tertiaryColor: '#F4F4F4'
                }
            });
            console.log('Mermaid initialized successfully');
        } else {
            console.error('Mermaid is not defined');
        }
    }
</script>
</body>
</html>
