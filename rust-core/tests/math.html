<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=800, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="app-resource://katex/katex.min.css" onerror="this.onerror=null; this.href='https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css'; console.log('Failed to load KaTeX CSS from local, falling back to CDN');">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            color: #333333;
            background: transparent;
            margin: 0;
            padding: 0;
            /* 移除 flex 布局，避免内容被裁剪 */
            width: fit-content;
            height: fit-content;
        }
        .math-container {
            display: inline-block;
            text-align: left;
            margin: 0;
            padding: 0;
            /* 确保容器能够容纳完整内容 */
            width: fit-content;
            height: fit-content;
            max-width: none;
            max-height: none;
            overflow: visible;
            white-space: nowrap;
        }
        .katex {
            font-size: 1em !important;
            /* 确保 katex 内容不被截断 */
            display: inline-block;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="math-container">
        <span class="katex-display"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8641em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span>
    </div>
</body>
</html>
