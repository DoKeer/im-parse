language = "C"
header = """/*
 * 自动生成的 C 头文件
 * 由 cbindgen 从 Rust FFI 代码生成
 * 请勿手动编辑此文件
 */
"""
include_guard = "IM_PARSE_CORE_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
usize_is_size_t = true
no_includes = false

# 导出所有带有 #[no_mangle] 的函数
[export]
exclude = []

# 导出所有结构体
[struct]

# 导出所有枚举
[enum]

# 函数导出配置
[fn]

