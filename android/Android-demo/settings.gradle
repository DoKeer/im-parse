pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // 本地 AAR 仓库（用于 IMParseSDK AAR 依赖）
        flatDir {
            dirs 'app/libs'
        }
    }
}

rootProject.name = "Android-demo"
include ':app'
// 使用 AAR 依赖，不需要模块依赖
